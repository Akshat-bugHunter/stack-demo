name: Build and Deploy
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/akshat-bughunter/stack-demo-api:latest
            ghcr.io/akshat-bughunter/stack-demo-api:${{ github.sha }}

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/akshat-bughunter/stack-demo-frontend:latest
            ghcr.io/akshat-bughunter/stack-demo-frontend:${{ github.sha }}

